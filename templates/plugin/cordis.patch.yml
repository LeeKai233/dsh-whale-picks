# {{PLUGIN_ID}} bundle patch: inserts the plugin row into the profile's
# client roster. Applied automatically once the package joins the profile's
# bundle list (dsh plugin --profile web add {{PLUGIN_NAME}}).
#
# WARNING: never add the same "{{INSERT_ID}}" insert row to the user profile
# patch (~/.dsh/profiles/web/cordis.patch.yml) too - insert rows are not
# deduplicated by id across layers and the loader refuses to boot with
# "duplicate loader entry id: {{INSERT_ID}}". Pick exactly one route.
- insert:
    - id: {{INSERT_ID}}
      name: "{{PLUGIN_NAME}}"
